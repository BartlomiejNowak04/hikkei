plugins {
  id 'java'
  id 'application'
  id 'com.diffplug.spotless' version '7.0.2'
  id 'jacoco'
  id 'pmd'
  id 'com.autonomousapps.dependency-analysis' version '2.19.0'
}

spotless {
  encoding 'UTF-8'

  format 'misc', {
    target '*.gradle', '.gitattributes', '.gitignore'

    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
    endWithNewline()
  }

  /// Maybe add extra options here in the future
  java {
    toggleOffOn('fmt: off', 'fmt: on')

    trimTrailingWhitespace()
    endWithNewline()

    googleJavaFormat('1.26.0')
    // formatAnnotations()

    // licenseHeader '/* (C) $YEAR under TBD */'
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
  mavenCentral()
}

configurations {
  mockitoAgent
}

dependencies {
  testImplementation 'net.jqwik:jqwik:1.9.2'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.12.1'
  testImplementation 'org.mockito:mockito-core:5.+'
  mockitoAgent('org.mockito:mockito-core:5.+') {
    transitive = false
  }
  testImplementation 'io.vertx:vertx-junit5'
  testImplementation 'io.rest-assured:rest-assured:5.5.6'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  compileOnly 'org.jetbrains:annotations:26.0.2'

  implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

  implementation 'org.postgresql:postgresql:42.7.3'

  implementation(platform("io.vertx:vertx-stack-depchain:5.0.1"))
  implementation "io.vertx:vertx-web-client"
  implementation "io.vertx:vertx-config"
  implementation "io.vertx:vertx-web"
  implementation 'io.github.cdimascio:dotenv-java:3.2.0'

  implementation 'io.vertx:vertx-auth-common:5.0.4'
  implementation 'io.vertx:vertx-auth-oauth2:5.0.4'
}

/// Test naming convention:
/// - *Test.class     - for standard jupyter unitary tests
/// - *PropTest.class - for jqwik property-based tests
test {
  useJUnitPlatform {
    includeEngines 'jqwik', 'junit-jupiter'
  }
  systemProperty 'jqwik.seeds.whenfixed', 'WARN'
  testLogging {
    events "passed", "skipped", "failed"
  }
  jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
  jvmArgs += "-Xshare:off"
  finalizedBy jacocoTestReport
}

/// Dead-code check (part of `check`): unused private members, locals and imports.
pmd {
  toolVersion = '7.16.0'
  ruleSets = []
  ruleSetFiles = files('config/pmd/unused-code.xml')
  consoleOutput = true
}

/// Unused-dependency check (`./gradlew buildHealth`, run by scripts/ci/backend.sh).
/// Only unused dependencies fail; the other advice is informational.
dependencyAnalysis {
  issues {
    all {
      onUnusedDependencies {
        severity('fail')
        // Used: the aggregate brings the JUnit Jupiter engine the tests run on.
        exclude('org.junit.jupiter:junit-jupiter')
        // Baseline: unused or used only through their transitives today.
        exclude('com.vladsch.flexmark:flexmark-all', 'io.vertx:vertx-web-client', 'net.jqwik:jqwik')
      }
      onUsedTransitiveDependencies { severity('ignore') }
      onIncorrectConfiguration { severity('ignore') }
      onRuntimeOnly { severity('ignore') }
      onCompileOnly { severity('ignore') }
      onUnusedAnnotationProcessors { severity('ignore') }
      onRedundantPlugins { severity('ignore') }
    }
  }
}

application {
  mainClass = 'dev.tfkls.hikkei.Main'
}
